# เริ่ม stack ในโหมดพัฒนา: docker compose up -d; เพิ่ม --build เมื่อต้องการสร้าง image ใหม่
# หยุดชั่วคราว [docker compose stop]
# ปิดระบบและลบ Container ทิ้ง [docker compose down]
# รีสตาร์ท [docker compose restart]
    
# นิยามบริการทั้งระบบ; compose.override.yml เพิ่ม Vite และการตรวจจับการเปลี่ยนไฟล์สำหรับนักพัฒนา
services:
  # Redis เป็นคิวกลางให้ API ส่งงานและให้ ARQ workers รับไปทำภายหลัง
  redis:
    image: redis:8.8.0-alpine         # ใช้ Redis รุ่น Alpine ขนาดเล็กเป็น broker ของคิวงาน
    restart: unless-stopped           # ให้ Docker เริ่ม service ใหม่หาก process หยุดโดยไม่ตั้งใจ
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data              # เก็บข้อมูล Redis ไว้ข้ามการ restart ของ container
    command: >                        # เปิด append-only log เพื่อเก็บการเปลี่ยนข้อมูลคิวลงดิสก์
      redis-server
      --appendonly yes               
    healthcheck:                      # ให้ Compose รอจน Redis ตอบ PING ก่อนเริ่มบริการที่พึ่งพา
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:                          # จำกัดขนาด/จำนวน log files เพื่อไม่ให้ log ใช้พื้นที่ไม่สิ้นสุด
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ai-network

  # PostgreSQL ภายในเครื่อง (ฐานข้อมูลหลักของระบบ)
  postgres:                           # เข้า shell ได้ด้วย docker compose exec postgres psql -U admin -d my_database
    image: postgres:15-alpine         # ใช้ PostgreSQL 15 เป็นฐานข้อมูลหลักของระบบ
    restart: unless-stopped
    environment:                      # กำหนดบัญชีและฐานข้อมูลเริ่มต้นสำหรับ local development
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secretpassword}
      - POSTGRES_DB=my_database
    ports:
      - "5433:5432"                   # host ใช้ 5433 เพื่อไม่ชน PostgreSQL ที่อาจใช้ 5432 อยู่แล้ว
    volumes:
      - postgres-data:/var/lib/postgresql/data  # เก็บไฟล์ฐานข้อมูลใน named volume ให้คงอยู่หลังปิด container
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-my_database}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:                      
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"                 
    networks:
      - ai-network

  # โหลดชุดข้อมูล inventory ลง PostgreSQL ก่อน API และ workers เริ่มทำงาน
  inventory-seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: i_loveseafood-backend:latest
    command: ["python", "/workers/seed_inventory.py"]
    restart: "no"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://admin:${POSTGRES_PASSWORD:-secretpassword}@postgres:5432/my_database}
      - STORAGE_ROOT=/app/storage
      - BACKEND_SRC=/app/src
    volumes:
      - ./workers:/workers:ro
      - ./backend/src:/app/src:ro
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ai-network

  # MinIO เก็บไฟล์ผ่าน API ที่เข้ากันได้กับ S3 เช่น dataset และ model artifacts
  minio:
    image: bitnami/minio:latest
    user: "0"
    ports: 
      - "9000:9000"       # พอร์ต 9000 เปิด S3 API ให้ backend/workers อ่านและเขียน object
      - "9001:9001"       # พอร์ต 9001 เปิดหน้าเว็บ Console สำหรับจัดการ MinIO ด้วยมือ
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
      MINIO_PROMETHEUS_AUTH_TYPE: "public" 
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:                      
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ai-network

  # สร้าง Buckets เริ่มต้นใน MinIO ให้พร้อมใช้โดยอัตโนมัติ
  minio-init:
    image: bitnami/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\";
      mc mb --ignore-existing local/mlflow-artifacts;
      mc mb --ignore-existing local/datasets;
      mc mb --ignore-existing local/models;
      mc mb --ignore-existing local/ai-ecosystem-data;
      mc mb --ignore-existing local/sampling-camera;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    networks:
      - ai-network
    restart: "no"

  # FastAPI รับ HTTP requests และเปิด health check ให้ host กับบริการใน Compose
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: i_loveseafood-backend:latest
    restart: unless-stopped
    command: ["python", "src/main.py"]
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://admin:${POSTGRES_PASSWORD:-secretpassword}@postgres:5432/my_database}
      - REDIS_URL=redis://redis:6379
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - STORAGE_ROOT=/app/storage
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-password123}
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:8080"]
      - OTEL_SERVICE_NAME=fastapi_backend
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - WATCHFILES_FORCE_POLLING=true
      - HF_REPO_ID=${HF_REPO_ID:-kkshaolin/yolo_box}
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic:ro
      - ./backend/alembic.ini:/app/alembic.ini:ro
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      inventory-seed:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - ai-network
    healthcheck:                      # ตรวจ readiness เพื่อป้องกันการเริ่ม service ก่อน dependency พร้อม
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # รับงาน forecast จาก ARQ แล้วเรียกบริการ inference สำหรับข้อมูลอนุกรมเวลา
  forecasting-worker:
    deploy:
      resources:
        limits:
          memory: 2G
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: i_loveseafood-backend:latest
    command: ["python", "-m", "arq", "inference_worker.worker.WorkerSettings"]
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=${DATABASE_URL:-postgresql://admin:${POSTGRES_PASSWORD:-secretpassword}@postgres:5432/my_database}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - STORAGE_ROOT=/app/storage
      - HF_REPO_ID=${HF_REPO_ID:-kkshaolin/yolo_box}
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ./storage:/app/storage
      - ./workers:/app
      - ./backend/src:/backend/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      inventory-seed:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      mlflow:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py", "inference_worker.worker.WorkerSettings"]
      interval: 60s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - ai-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ตัดครอปรูปจากกล้อง 2 ตัว (mockA.mp4, mockB.mp4) เก็บลง MinIO bucket sampling-camera/ZoneA และ /ZoneB
  # พร้อมระบบงานอัตโนมัติรายวัน (ตั้งค่าปิดไว้เป็นค่าเริ่มต้น DAILY_SAMPLING_ENABLED=false)
  # และทำงานทันทีเมื่อได้รับคำสั่ง predict จากหน้าเว็บ
  sampling-worker:
    deploy:
      resources:
        limits:
          memory: 1G
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: i_loveseafood-backend:latest
    command: ["python", "-m", "arq", "sampling_worker.worker.WorkerSettings"]
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=${DATABASE_URL:-postgresql://admin:${POSTGRES_PASSWORD:-secretpassword}@postgres:5432/my_database}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-password123}
      - MINIO_SECURE=false
      - DAILY_SAMPLING_ENABLED=false
      - STORAGE_ROOT=/app/storage
      - HF_REPO_ID=${HF_REPO_ID:-kkshaolin/yolo_box}
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ./storage:/app/storage
      - ./workers:/app
      - ./backend/src:/backend/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py", "sampling_worker.worker.WorkerSettings"]
      interval: 60s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - ai-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ฝึกโมเดลแยกจาก API เพื่อไม่ให้งานคำนวณหนักขัดขวางคำขอจากหน้าเว็บ
  # รองรับทั้ง ARIMA (ดึงข้อมูลจาก PostgreSQL) และ YOLO (ดาวน์โหลด Dataset จาก MinIO)
  training-worker:
    deploy:
      resources:
        limits:
          memory: 4G          # YOLO training ต้องการ RAM มากกว่า ARIMA
    build:
      context: ./workers
      dockerfile: Dockerfile
    command: ["python", "-m", "arq", "training_worker.worker.WorkerSettings"]
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=${DATABASE_URL:-postgresql://admin:${POSTGRES_PASSWORD:-secretpassword}@postgres:5432/my_database}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - STORAGE_ROOT=/app/storage
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-password123}
      - MINIO_SECURE=false
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-admin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-password123}
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - HF_REPO_ID=${HF_REPO_ID:-kkshaolin/yolo_box}
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ./storage:/app/storage
      - ./workers:/app
      - ./backend/src:/backend/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      inventory-seed:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      mlflow:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py", "training_worker.worker.WorkerSettings"]
      interval: 60s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - ai-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"



  # ดึงข้อมูลตลาด/การเงิน/การซื้อขายตามกำหนด; โค้ดอยู่ใน workers/data_worker/
  data-worker:
    deploy:
      resources:
        limits:
          memory: 1G
    build:
      context: ./workers
      dockerfile: Dockerfile.data
    command: ["python", "-m", "arq", "data_worker.worker.WorkerSettings"]
    restart: unless-stopped
    environment:
      - TZ=Asia/Bangkok               # cron ใน data_worker.py อิงเวลานี้
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=${DATABASE_URL:-postgresql://admin:${POSTGRES_PASSWORD:-secretpassword}@postgres:5432/my_database}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-password123}
      - DATASETS_BUCKET=datasets
      - STOCK_SYMBOLS=TU,ASIAN,CFRESH,TC,SSF
      - FX_SYMBOLS=USDTHB=X
    volumes:
      - ./workers:/app                # แก้โค้ดแล้ว docker compose restart data-worker ได้เลย
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy    # backend เตรียมตารางฐานข้อมูลตอนเริ่มก่อนให้ worker ทำงาน
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py", "data_worker.worker.WorkerSettings"]
      interval: 60s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - ai-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # MLflow เก็บ metadata ของการทดลองใน PostgreSQL และ artifacts ใน MinIO
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-admin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-password123}
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
    command: >
      mlflow server
      --backend-store-uri ${DATABASE_URL:-postgresql://admin:${POSTGRES_PASSWORD:-secretpassword}@postgres:5432/my_database}
      --default-artifact-root s3://mlflow-artifacts
      --host 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - ai-network

  # TensorBoard แสดงกราฟการฝึกโมเดล YOLO (Loss, Metrics, Learning Rate)
  tensorboard:
    build:
      context: .
      dockerfile: Dockerfile.tensorboard
    restart: unless-stopped
    ports:
      - "6006:6006"
    volumes:
      - ./storage/logs/tensorboard:/logs:ro
    networks:
      - ai-network

  # Label Studio สำหรับจัดการตีกรอบ Annotations / Bounding Box ของรูปภาพ
  label-studio:
    image: heartexlabs/label-studio:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - LABEL_STUDIO_HOST=http://localhost:8080
      - LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED=true
      - LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT=/label-studio/data
      - LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK=false
    volumes:
      - ./storage/data/label_studio_data:/label-studio/data
    networks:
      - ai-network

  # Prometheus ดึง metrics จาก endpoint ที่ OpenTelemetry Collector เปิดไว้
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - ai-network

  # Loki เป็นที่เก็บ log กลางที่ Promtail ส่งข้อมูลเข้ามา
  loki:
    image: grafana/loki:3.0.0
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - ai-network

  # Promtail อ่าน log ของ Docker containers แล้วส่งต่อไป Loki
  promtail:
    image: grafana/promtail:3.0.0
    restart: unless-stopped
    volumes:
      - ./observability/promtail.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - ai-network

  # Tempo เก็บ traces ที่ Collector ส่งมาด้วยโปรโตคอล OTLP
  tempo:
    image: grafana/tempo:latest
    user: "0"
    restart: unless-stopped
    ports:
      - "3200:3200"
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yaml
      - tempo_data:/tmp/tempo
    command: -config.file=/etc/tempo.yaml
    networks:
      - ai-network

  # Collector รับ telemetry จากแอปแล้วส่ง traces/metrics ไปยังระบบปลายทาง
  otel-collector:
    image: otel/opentelemetry-collector:0.100.0
    restart: unless-stopped
    ports:
      - "4317:4317" # พอร์ต OTLP แบบ gRPC สำหรับแอปที่ส่ง telemetry
      - "4318:4318" # พอร์ต OTLP แบบ HTTP ใช้ใน development override
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol/config.yaml
    networks:
      - ai-network

  # Grafana แสดง metrics/logs/traces โดยตั้ง datasource และ dashboard ไว้ล่วงหน้า
  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secretpassword}
    volumes:
      - ./observability/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./observability/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/provider.yml:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - ai-network

  # Frontend production ใช้ Nginx; compose.override.yml เปลี่ยนเป็น Vite สำหรับพัฒนา
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ai-network

# Named volumes รักษาข้อมูลไว้เมื่อ containers ถูก restart หรือสร้างใหม่
volumes:
  minio_data:
  redis-data:
  postgres-data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:

# Network ภายในทำให้ service เรียกหากันด้วยชื่อที่กำหนดใน Compose
networks:
  ai-network:
    driver: bridge
# คำสั่งเริ่มการทำงาน [docker compose up -d] / Build Image ใหม่ [docker compose up -d --build]  
# หยุดชั่วคราว [docker compose stop]
# ปิดระบบและลบ Container ทิ้ง [docker compose down]
# รีสตาร์ท [docker compose restart]
    
services:
  redis:                              # ตั้งชื่อ Service
    image: redis:8.8.0-alpine         # เลือกใช้ Image ของ Redis
    container_name: redis             # ชื่อตัวคอนเทนเนอร์
    restart: unless-stopped           # เปิดตัวเองใหม่ตลอดเวลาหากระบบล่ม
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data              # เชื่อมต่อพื้นที่เก็บข้อมูลจำลอง เพื่อไม่ให้ข้อมูลหายเมื่อคอนเทนเนอร์ถูกปิดหรือลบ
    command: >                        # บันทึกข้อมูลลงฮาร์ดดิสก์เรื่อย ๆ กันข้อมูลสูญหาย
      redis-server
      --appendonly yes               
    healthcheck:                      # ระบบคอยตรวจสอบตัวเอง
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:                          # ส่วนจัดการ Log ของ Redis
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ai-network

  postgres:                           # docker exec -it postgres_db psql -U admin -d my_database
    image: postgres:15-alpine         # Image ของ PostgreSQL เวอร์ชัน 15
    container_name: postgres_db       # ชื่อคอนเทนเนอร์
    restart: unless-stopped
    environment:                      # ตั้งค่า Username, Password และชื่อ Database เริ่มต้น
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secretpassword
      - POSTGRES_DB=my_database
    ports:
      - "5433:5432"                   # พอร์ต PostgreSQL บนโฮสต์ เพื่อหลีกเลี่ยงการชนกับ postgres ท้องถิ่น
    volumes:
      - postgres-data:/var/lib/postgresql/data  # เก็บข้อมูลจำลองไว้เพื่อไม่ให้ข้อมูลหาย     
    logging:                      
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"                 
    networks:
      - ai-network

  label-studio:
    image: heartexlabs/label-studio:latest
    container_name: label-studio
    restart: unless-stopped
    ports:
      - "8080:8080"                   # เข้าใช้งานผ่าน http://localhost:8080
    volumes:
      - ./storage/data/label_studio_data:/label-studio/data # ทำ Label
    environment:
      - LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED=true
      - LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT=/label-studio/data/images
    logging:                      
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ai-network

  minio:                              
    image: minio/minio:latest
    container_name: minio_server
    ports: 
      - "9000:9000"       # 9000 ใช้สำหรับเชื่อมต่อ S3 API เพื่อเขียน/อ่านไฟล์
      - "9001:9001"       # 9001 สำหรับเข้าใช้งานหน้าเว็บจัดการ (Web Console)
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
      MINIO_PROMETHEUS_AUTH_TYPE: "public" 
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    logging:                      
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ai-network
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastapi_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://admin:secretpassword@postgres:5432/my_database
      - REDIS_URL=redis://redis:6379
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=password123
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:8080"]
      - OTEL_SERVICE_NAME=fastapi_backend
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel_collector:4317
    volumes:
      - ./backend/src:/app/src
      - ./storage/logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  training-worker:
    build:
      context: ./workers
      dockerfile: Dockerfile
    image: ai-ecosystem-worker:latest
    container_name: training_worker
    command: ["python", "-m", "arq", "training_worker.WorkerSettings"]
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=password123
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password123
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - STORAGE_PATH=/app/storage
    volumes:
      - ./storage:/app/storage
      - ./workers:/app
    depends_on:
      - redis
      - minio
    networks:
      - ai-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  inference-worker:
    build:
      context: ./workers
      dockerfile: Dockerfile
    image: ai-ecosystem-worker:latest
    container_name: inference_worker
    command: ["python", "-m", "arq", "inference_worker.WorkerSettings"]
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=password123
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password123
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - STORAGE_PATH=/app/storage
      - OTEL_SERVICE_NAME=inference_worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel_collector:4317
    volumes:
      - ./storage:/app/storage
      - ./workers:/app
    depends_on:
      - redis
      - minio
      - mlflow
    networks:
      - ai-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  data-worker:                        # ดึงข้อมูลจากภายนอก (ราคาหุ้น/ค่าเงิน, งบการเงิน, สถิติส่งออก) — ดู workers/ingestion/
    build:
      context: ./workers
      dockerfile: Dockerfile.data
    container_name: data_worker
    command: ["python", "-m", "arq", "data_worker.WorkerSettings"]
    restart: unless-stopped
    environment:
      - TZ=Asia/Bangkok               # cron ใน data_worker.py อิงเวลานี้
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://admin:secretpassword@postgres:5432/my_database
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=password123
      - DATASETS_BUCKET=datasets
      - STOCK_SYMBOLS=TU,ASIAN,CFRESH,TC,SSF
      - FX_SYMBOLS=USDTHB=X
    volumes:
      - ./workers:/app                # แก้โค้ดแล้ว docker compose restart data-worker ได้เลย
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      backend:
        condition: service_healthy    # backend สร้างตาราง (create_all) ตอนสตาร์ท
    networks:
      - ai-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: mlflow_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password123
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
    command: >
      mlflow server
      --backend-store-uri postgresql://admin:secretpassword@postgres:5432/my_database
      --default-artifact-root s3://mlflow-artifacts
      --host 0.0.0.0
    depends_on:
      postgres:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - ai-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - ai-network

  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - ai-network

  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    restart: unless-stopped
    volumes:
      - ./observability/promtail.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - ai-network

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    user: "0"
    restart: unless-stopped
    ports:
      - "3200:3200"
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yaml
      - tempo_data:/tmp/tempo
    command: -config.file=/etc/tempo.yaml
    networks:
      - ai-network

  otel-collector:
    image: otel/opentelemetry-collector:0.100.0
    container_name: otel_collector
    restart: unless-stopped
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol/config.yaml
    networks:
      - ai-network

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./observability/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - grafana_data:/var/lib/grafana
    networks:
      - ai-network

volumes:         # Volumes - พื้นที่เก็บข้อมูลถาวร           # พื้นที่เพื่อให้ Services ด้านบนเรียกใช้ได้
  minio_data:
  redis-data:
  postgres-data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:

networks:         # Networks - เครือข่ายภายใน
  ai-network:
    driver: bridge
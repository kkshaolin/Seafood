server {
    # ให้บริการไฟล์ frontend ผ่าน HTTP port ของ container ในโหมด production
    listen 80;
    server_name localhost;

    location / {
        # ส่งไฟล์ที่ build แล้วให้ browser และ fallback ไป index.html สำหรับ URL ภายในของ SPA
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # ส่งคำขอ /api ต่อไปยัง backend service ที่อยู่ใน Compose network เดียวกัน
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

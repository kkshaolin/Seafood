# สร้างการเชื่อมต่อ Grafana ไปยังบริการ metrics, traces, logs และฐานข้อมูลไว้ล่วงหน้า
apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    access: proxy
    isDefault: true
  - name: Tempo
    type: tempo
    uid: tempo
    url: http://tempo:3200
    access: proxy
  - name: Loki
    type: loki
    uid: loki
    url: http://loki:3100
    access: proxy
  - name: PostgreSQL
    type: postgres
    uid: postgres
    url: postgres:5432
    user: admin
    secureJsonData:
      password: "secretpassword"
    jsonData:
      database: my_database
      sslmode: disable
    version: 3

